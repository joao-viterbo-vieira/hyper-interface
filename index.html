<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hyper Interface · knowledge hypergraph of robot R1</title>
<meta name="description" content="Hyper Interface: human-supervised knowledge hypergraph memory for autonomous robots. Interactive demo of the ROBOT2026 poster.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23101b3d'/%3E%3Cpath d='M8 9c8-4 17 0 16 8s-9 10-14 6-6-11-2-14z' fill='%231d5bd6' fill-opacity='.35' stroke='%236f9bff' stroke-width='1.8'/%3E%3Ccircle cx='12' cy='13' r='2.6' fill='%23fff'/%3E%3Ccircle cx='20' cy='15' r='2.6' fill='%23fff'/%3E%3Ccircle cx='15' cy='21' r='2.6' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
<script src="vendor/3d-force-graph.min.js" defer></script>
</head>
<body>
<div id="window">
  <header id="titlebar">
    <span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>
    <h1>Hyper Interface <span>· knowledge hypergraph of robot R1</span></h1>
    <div id="search-wrap">
      <input id="search" type="search" placeholder="Search entities and facts…" autocomplete="off" aria-label="Search">
      <div id="results" hidden></div>
    </div>
    <button id="theme" data-act="theme" title="Dark / light" aria-label="Switch between dark and light">◐</button>
  </header>

  <nav id="rail" aria-label="Modes"></nav>

  <main id="stage">
    <svg id="canvas" role="img" aria-label="Knowledge hypergraph of robot R1"></svg>
    <div id="stage3d" hidden></div>
    <p id="empty" hidden>Nothing to draw with these filters in this memory state.</p>
    <div id="bar">
      <div class="row">
        <div id="views" class="seg"></div>
        <button id="opt-toggle" data-act="options" title="Scene and filters" aria-label="Scene and filters" aria-expanded="false"><svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></svg></button>
      </div>
      <div id="options"></div>
    </div>
    <div id="readonly" hidden></div>
    <div id="note" hidden></div>
    <div id="legend"></div>
    <div id="count"></div>
    <div id="zoom">
      <button data-act="zoom" data-id="in" title="Zoom in" aria-label="Zoom in">+</button>
      <button data-act="zoom" data-id="out" title="Zoom out" aria-label="Zoom out">−</button>
      <button data-act="zoom" data-id="fit" title="Fit" aria-label="Fit">⤢</button>
    </div>
  </main>

  <footer id="timeline"></footer>

  <aside id="panel"></aside>
</div>
<script src="js/data.js" defer></script>
<script src="js/store.js" defer></script>
<script src="js/canvas.js" defer></script>
<script src="js/view3d.js" defer></script>
<script src="js/gallery.js" defer></script>
<script src="js/app.js" defer></script>
</body>
</html>
